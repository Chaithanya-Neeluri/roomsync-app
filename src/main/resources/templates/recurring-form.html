<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/head :: head}"></head>
<body class="app-body">
<div class="app-shell">
	<aside class="d-none d-lg-flex" th:replace="~{fragments/sidebar :: sidebar}"></aside>
	<main class="app-main">
		<header th:replace="~{fragments/topbar :: topbar}"></header>
		<div th:replace="~{fragments/mobile-nav :: mobileNav}"></div>
		<section class="app-content">
			<div th:replace="~{fragments/alerts :: alerts}"></div>
			<form class="panel form-panel" th:action="@{/recurring/save}" method="post" id="expenseForm">
				<input type="hidden" name="id" th:value="${bill.id}">
				<div class="row g-3">
					<div class="col-md-6">
						<label class="form-label">Bill name</label>
						<input class="form-control" name="billName" required maxlength="120" th:value="${bill.billName}">
					</div>
					<div class="col-md-6">
						<label class="form-label">Category</label>
						<select class="form-select" name="category" required>
							<option th:each="item : ${categories}" th:value="${item}" th:text="${item.label}" th:selected="${item == bill.category}"></option>
						</select>
					</div>
					<div class="col-md-4">
						<label class="form-label">Amount (₹)</label>
						<input class="form-control" type="number" step="0.01" min="0.01" name="amount" id="totalAmount" required th:value="${bill.amount}">
					</div>
					<div class="col-md-4">
						<label class="form-label">Frequency</label>
						<select class="form-select" name="frequency" required>
							<option th:each="item : ${frequencies}" th:value="${item}" th:text="${item.label}" th:selected="${item == bill.frequency}"></option>
						</select>
					</div>
					<div class="col-md-4">
						<label class="form-label">Usually paid by</label>
						<select class="form-select" name="paidById" required>
							<option value="">Select roommate</option>
							<option th:each="roommate : ${roommates}" th:value="${roommate.id}" th:text="${roommate.name}"
								th:selected="${bill.paidBy != null && bill.paidBy.id == roommate.id}"></option>
						</select>
					</div>
					<div class="col-md-4">
						<label class="form-label">Start date</label>
						<input class="form-control" type="date" name="startDate" required th:value="${bill.startDate}">
					</div>
					<div class="col-md-4">
						<label class="form-label">Next due date</label>
						<input class="form-control" type="date" name="nextDueDate" th:value="${bill.nextDueDate}">
					</div>
					<div class="col-md-4">
						<label class="form-label">Splitting method</label>
						<select class="form-select" name="splittingMethod" id="splittingMethod">
							<option th:each="method : ${splitMethods}" th:value="${method}" th:text="${method.label}"
								th:selected="${method == bill.splittingMethod}"></option>
						</select>
					</div>
					<div class="col-md-4" th:if="${bill.id != null}">
						<label class="form-label">Active</label>
						<select class="form-select" name="active">
							<option th:value="true" th:selected="${bill.active}">Active</option>
							<option th:value="false" th:selected="${!bill.active}">Paused</option>
						</select>
					</div>
				</div>
				<div class="split-box mt-4" id="customSplitBox">
					<h3>Custom split</h3>
					<div class="row g-2" th:each="roommate : ${roommates}">
						<div class="col-md-6" th:text="${roommate.name}">Name</div>
						<div class="col-md-6">
							<input class="form-control custom-amount" type="number" step="0.01" min="0"
								th:name="${'customAmount_' + roommate.id}"
								th:value="${bill.customShares != null ? bill.customShares.get(roommate.id) : ''}">
						</div>
					</div>
				</div>
				<div class="split-preview mt-4" id="splitPreview"></div>
				<div class="mt-4 d-flex gap-2">
					<button class="btn btn-outline-secondary" type="button" id="previewBtn">Show split</button>
					<button class="btn btn-primary" type="submit">Save bill</button>
					<a class="btn btn-link" th:href="@{/recurring}">Cancel</a>
				</div>
			</form>
		</section>
	</main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
	const roommates = /*[[${roommates}]]*/ [];
</script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
