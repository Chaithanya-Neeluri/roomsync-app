<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/head :: head}"></head>
<body class="app-body">
<div class="app-shell">
	<aside class="d-none d-lg-flex" th:replace="~{fragments/sidebar :: sidebar}"></aside>
	<main class="app-main">
		<header th:replace="~{fragments/topbar :: topbar}"></header>
		<div th:replace="~{fragments/mobile-nav :: mobileNav}"></div>
		<section class="app-content">
			<div th:replace="~{fragments/alerts :: alerts}"></div>
			<div class="d-flex justify-content-between align-items-center mb-4">
				<p class="text-muted mb-0">People who share household bills.</p>
				<button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#roommateModal" onclick="openRoommateModal()">
					<i class="bi bi-person-plus me-1"></i> Add roommate
				</button>
			</div>

			<div class="row g-3" th:if="${!roommates.isEmpty()}">
				<div class="col-md-6 col-xl-4" th:each="roommate : ${roommates}">
					<div class="panel roommate-card">
						<div class="d-flex align-items-center gap-3">
							<span class="avatar-circle lg" th:text="${roommate.initials}">A</span>
							<div>
								<h3 class="h6 mb-1" th:text="${roommate.name}">Name</h3>
								<div class="text-muted small" th:text="${roommate.phone != null ? roommate.phone : 'No phone'}">Phone</div>
								<div class="text-muted small" th:text="${'Added ' + roommate.dateAdded}">Date</div>
							</div>
						</div>
						<div class="mt-3 d-flex gap-2">
							<button class="btn btn-sm btn-outline-primary"
								th:attr="onclick=|openRoommateModal(${roommate.id}, '${#strings.escapeJava(roommate.name)}', '${roommate.phone != null ? #strings.escapeJava(roommate.phone) : ''}')|">
								Edit
							</button>
							<form th:action="@{/roommates/{id}/delete(id=${roommate.id})}" method="post" onsubmit="return confirm('Delete this roommate?');">
								<button class="btn btn-sm btn-outline-danger" type="submit">Delete</button>
							</form>
						</div>
					</div>
				</div>
			</div>
			<div class="panel empty-panel" th:if="${roommates.isEmpty()}">
				<h2>No roommates yet</h2>
				<p class="text-muted">Add the people who live together so expenses can be split.</p>
			</div>
		</section>
	</main>
</div>

<div class="modal fade" id="roommateModal" tabindex="-1">
	<div class="modal-dialog">
		<form class="modal-content" th:action="@{/roommates}" method="post">
			<div class="modal-header">
				<h5 class="modal-title" id="roommateModalTitle">Add roommate</h5>
				<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
			</div>
			<div class="modal-body">
				<input type="hidden" name="id" id="roommateId">
				<div class="mb-3">
					<label class="form-label">Name</label>
					<input class="form-control" name="name" id="roommateName" required maxlength="80">
				</div>
				<div class="mb-0">
					<label class="form-label">Phone number <span class="text-muted">(optional)</span></label>
					<input class="form-control" name="phone" id="roommatePhone" maxlength="20">
				</div>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
				<button type="submit" class="btn btn-primary">Save</button>
			</div>
		</form>
	</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
