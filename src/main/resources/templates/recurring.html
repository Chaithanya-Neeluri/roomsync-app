<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/head :: head}"></head>
<body class="app-body">
<div class="app-shell">
	<aside class="d-none d-lg-flex" th:replace="~{fragments/sidebar :: sidebar}"></aside>
	<main class="app-main">
		<header th:replace="~{fragments/topbar :: topbar}"></header>
		<div th:replace="~{fragments/mobile-nav :: mobileNav}"></div>
		<section class="app-content">
			<div th:replace="~{fragments/alerts :: alerts}"></div>
			<div class="d-flex justify-content-between align-items-center mb-4">
				<p class="text-muted mb-0">Rent, electricity and other repeating bills.</p>
				<a class="btn btn-primary" th:href="@{/recurring/new}"><i class="bi bi-plus-lg me-1"></i> Add recurring bill</a>
			</div>
			<div class="panel table-wrap" th:if="${!bills.isEmpty()}">
				<table class="table align-middle mb-0">
					<thead>
						<tr>
							<th>Bill</th>
							<th>Amount</th>
							<th>Frequency</th>
							<th>Next due</th>
							<th>Status</th>
							<th></th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="bill : ${bills}">
							<td>
								<strong th:text="${bill.billName}">Rent</strong>
								<div class="small text-muted" th:text="${bill.category.label}">Rent</div>
							</td>
							<td th:text="${'₹' + #numbers.formatDecimal(bill.amount, 1, 'COMMA', 2, 'POINT')}">₹0</td>
							<td th:text="${bill.frequency.label}">Monthly</td>
							<td th:text="${bill.nextDueDate}">2026-01-01</td>
							<td>
								<span class="status-pill" th:classappend="${bill.active} ? ' paid' : ' pending'" th:text="${bill.active} ? 'Active' : 'Paused'">Active</span>
							</td>
							<td class="text-end">
								<a class="btn btn-sm btn-outline-primary" th:href="@{/recurring/{id}/edit(id=${bill.id})}">Edit</a>
								<form class="d-inline" th:action="@{/recurring/{id}/pause(id=${bill.id})}" method="post">
									<button class="btn btn-sm btn-outline-secondary" type="submit" th:text="${bill.active} ? 'Pause' : 'Resume'">Pause</button>
								</form>
								<form class="d-inline" th:action="@{/recurring/{id}/delete(id=${bill.id})}" method="post" onsubmit="return confirm('Delete this recurring bill?');">
									<button class="btn btn-sm btn-outline-danger" type="submit">Delete</button>
								</form>
							</td>
						</tr>
					</tbody>
				</table>
			</div>
			<div class="panel empty-panel" th:if="${bills.isEmpty()}">
				<h2>No recurring bills</h2>
				<p class="text-muted">Create monthly rent or Wi-Fi and RoomSync will generate expenses when they are due.</p>
			</div>
		</section>
	</main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
