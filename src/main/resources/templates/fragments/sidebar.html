<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<aside th:fragment="sidebar" class="app-sidebar">
	<a class="sidebar-brand" th:href="@{/}">
		<span class="brand-mark"><i class="bi bi-houses"></i></span>
		<span>
			<span class="brand-text d-block">RoomSync</span>
			<small class="text-muted">Bill split for roommates</small>
		</span>
	</a>

	<div class="sidebar-label">Menu</div>
	<nav class="sidebar-nav">
		<a class="sidebar-link" th:classappend="${activePage == 'dashboard'} ? ' active'" th:href="@{/}">
			<i class="bi bi-grid-1x2"></i> Dashboard
		</a>
		<a class="sidebar-link" th:classappend="${activePage == 'roommates'} ? ' active'" th:href="@{/roommates}">
			<i class="bi bi-people"></i> Roommates
		</a>
		<a class="sidebar-link" th:classappend="${activePage == 'expenses'} ? ' active'" th:href="@{/expenses}">
			<i class="bi bi-receipt"></i> Expenses
		</a>
		<a class="sidebar-link" th:classappend="${activePage == 'recurring'} ? ' active'" th:href="@{/recurring}">
			<i class="bi bi-arrow-repeat"></i> Recurring Bills
		</a>
		<a class="sidebar-link" th:classappend="${activePage == 'payments'} ? ' active'" th:href="@{/payments}">
			<i class="bi bi-wallet2"></i> Payments
		</a>
		<a class="sidebar-link" th:classappend="${activePage == 'balances'} ? ' active'" th:href="@{/balances}">
			<i class="bi bi-bar-chart"></i> Balances
		</a>
	</nav>
</aside>
</body>
</html>
