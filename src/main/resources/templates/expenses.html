<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/head :: head}"></head>
<body class="app-body">
<div class="app-shell">
	<aside class="d-none d-lg-flex" th:replace="~{fragments/sidebar :: sidebar}"></aside>
	<main class="app-main">
		<header th:replace="~{fragments/topbar :: topbar}"></header>
		<div th:replace="~{fragments/mobile-nav :: mobileNav}"></div>
		<section class="app-content">
			<div th:replace="~{fragments/alerts :: alerts}"></div>
			<form class="filter-bar panel mb-4" method="get" th:action="@{/expenses}">
				<div class="row g-2 align-items-end">
					<div class="col-md-4">
						<label class="form-label">Search</label>
						<input class="form-control" name="q" th:value="${q}" placeholder="Expense name">
					</div>
					<div class="col-md-3">
						<label class="form-label">Category</label>
						<select class="form-select" name="category">
							<option value="">All</option>
							<option th:each="item : ${categories}" th:value="${item}" th:text="${item.label}" th:selected="${item == category}"></option>
						</select>
					</div>
					<div class="col-md-2">
						<label class="form-label">From</label>
						<input class="form-control" type="date" name="from" th:value="${from}">
					</div>
					<div class="col-md-2">
						<label class="form-label">To</label>
						<input class="form-control" type="date" name="to" th:value="${to}">
					</div>
					<div class="col-md-1">
						<button class="btn btn-primary w-100" type="submit">Go</button>
					</div>
				</div>
			</form>

			<div class="panel table-wrap" th:if="${!expenses.isEmpty()}">
				<table class="table align-middle mb-0">
					<thead>
						<tr>
							<th>Expense</th>
							<th>Category</th>
							<th>Date</th>
							<th>Paid by</th>
							<th class="text-end">Amount</th>
							<th></th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="expense : ${expenses}">
							<td>
								<a th:href="@{/expenses/{id}(id=${expense.id})}" th:text="${expense.name}">Name</a>
							</td>
							<td th:text="${expense.category.label}">Rent</td>
							<td th:text="${expense.expenseDate}">2026-01-01</td>
							<td th:text="${expense.paidBy.name}">Alex</td>
							<td class="text-end" th:text="${'₹' + #numbers.formatDecimal(expense.totalAmount, 1, 'COMMA', 2, 'POINT')}">₹0</td>
							<td class="text-end">
								<a class="btn btn-sm btn-outline-primary" th:href="@{/expenses/{id}/edit(id=${expense.id})}">Edit</a>
								<form class="d-inline" th:action="@{/expenses/{id}/delete(id=${expense.id})}" method="post" onsubmit="return confirm('Delete this expense?');">
									<button class="btn btn-sm btn-outline-danger" type="submit">Delete</button>
								</form>
							</td>
						</tr>
					</tbody>
				</table>
			</div>
			<div class="panel empty-panel" th:if="${expenses.isEmpty()}">
				<h2>No expenses found</h2>
				<p class="text-muted mb-3">Add a household bill and split it between roommates.</p>
				<a class="btn btn-primary" th:href="@{/expenses/new}">Add expense</a>
			</div>
		</section>
	</main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
